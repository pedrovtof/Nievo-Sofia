<!DOCTYPE html>
<html lang="pt-BR" style="">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    name="viewport">
  <title>SOFIA - Conhecimento e Comunidades</title>
  <!-- Tailwind CSS CDN with plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Plus Jakarta Sans for modern clean UI typography -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"
    rel="stylesheet">
  <!-- Tailwind Custom Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            sofia: {
              dark: '#080511',
              neonPurple: '#a855f7',
              neonMagenta: '#d946ef',
              neonPink: '#ec4899',
              glassBorder: 'rgba(216, 180, 254, 0.22)',
              glassBg: 'rgba(18, 11, 33, 0.65)',
            }
          },
          boxShadow: {
            'glow-btn': '0 0 25px -4px rgba(217, 70, 239, 0.65), 0 0 10px -2px rgba(168, 85, 247, 0.4)',
            'glow-card': '0 0 35px -5px rgba(168, 85, 247, 0.25)',
            'glow-sm': '0 0 15px rgba(192, 132, 252, 0.3)',
          }
        }
      }
    }
  </script>
  <!-- BEGIN: Custom Glass & Ambient Styles -->
  <style data-purpose="ambient-gradients">
    /* Deep space cyberpunk ambient light effects */
    body {
      background-color: #07040f;
      color: #f3f4f6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .ambient-sphere-1 {
      position: absolute;
      top: -8%;
      right: -15%;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(217, 70, 239, 0.45) 0%, rgba(147, 51, 234, 0.2) 50%, transparent 75%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      animation: pulse-slow 8s ease-in-out infinite alternate;
    }

    .ambient-sphere-2 {
      position: absolute;
      bottom: 8%;
      left: -20%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.45) 0%, rgba(236, 72, 153, 0.25) 55%, transparent 80%);
      filter: blur(75px);
      z-index: 0;
      pointer-events: none;
      animation: pulse-slow 10s ease-in-out 2s infinite alternate;
    }

    .ambient-sphere-3 {
      position: absolute;
      top: 38%;
      left: 10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, transparent 70%);
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
    }

    @keyframes pulse-slow {
      0% {
        transform: scale(0.95) translate(0, 0);
        opacity: 0.85;
      }

      100% {
        transform: scale(1.1) translate(10px, -15px);
        opacity: 1;
      }
    }
  </style>
  <style data-purpose="glass-styling">
    /* High quality Glassmorphism border and reflection effects */
    .glass-card-main {
      background: linear-gradient(135deg, rgba(26, 16, 44, 0.72) 0%, rgba(13, 8, 24, 0.82) 100%);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(236, 72, 153, 0.28);
      box-shadow:
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 2px 0 rgba(168, 85, 247, 0.3),
        0 20px 50px -10px rgba(0, 0, 0, 0.7),
        0 0 35px -5px rgba(168, 85, 247, 0.25);
    }

    .glass-input-box {
      background: rgba(18, 12, 33, 0.55);
      border: 1px solid rgba(192, 132, 252, 0.22);
      backdrop-filter: blur(16px);
      transition: all 0.25s ease;
    }

    .glass-input-box:focus-within {
      border-color: rgba(217, 70, 239, 0.7);
      box-shadow: 0 0 16px -2px rgba(217, 70, 239, 0.35);
      background: rgba(25, 16, 46, 0.7);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-pill-active {
      background: rgba(168, 85, 247, 0.18);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(217, 70, 239, 0.4);
    }

    /* Specular glare edge across top edge */
    .specular-highlight {
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
    }
  </style>
  <!-- END: Custom Glass & Ambient Styles -->
</head>

<body class="min-h-screen w-full flex justify-center items-center p-0 sm:p-4 select-none relative font-sans">
  <!-- Ambient Light Orbs -->
  <div class="ambient-sphere-1"></div>
  <div class="ambient-sphere-2"></div>
  <div class="ambient-sphere-3"></div>
  <!-- BEGIN: MobileDeviceContainer -->

    class="w-full max-w-[420px] min-h-screen sm:min-h-[860px] sm:h-[890px] sm:rounded-[44px] bg-[#0c0817] relative overflow-hidden flex flex-col justify-between p-5 sm:border sm:border-purple-500/20 shadow-2xl">
    <!-- Top Fluid Smoke Image Glow Overlay -->
    <div class="absolute inset-0 pointer-events-none opacity-30 mix-blend-screen overflow-hidden z-0">
      <img alt="Efeito Abstrato Neon" class="w-full h-full object-cover scale-150 transform rotate-12 blur-[2px]"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDF40v-acFQTfCbJpHmoL6S1enwsvDJ2XOMxtiDuHVRiasLRJJQjO648tK7UtdvUp_HUsua9JdhYhgxwpEk6qkxpqvp7izmEHqeVWQCyBLK33YdVvp4vrStjLzByGfGGX4ktloxrfoPVIXu0UwyrRBdWL9-L85GqZfmNN9EGts3W3EzP059RANe6puv9k72ofvCVz6neUEW68f6XisM7QMK-7fBhodO0d95q7JNvenjT5OVa-Q8pfstZ1tR0LynlxRlEZk">
    </div>
    <!-- BEGIN: TopBar -->
    <header class="relative z-10 pt-2 px-1 flex items-center justify-between">
      <!-- iOS style clock indicator -->
      <span class="text-xs font-semibold text-purple-200/80 tracking-wider">9:41</span>
      <!-- Top Badges / Indicators -->
      <div class="flex items-center gap-2">
        <!-- Live Badge Indicator -->
        <div
          class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-500/15 border border-red-500/40 text-[10px] font-bold text-red-400 tracking-wider">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
          AO VIVO
        </div>
        <!-- 18+ Advisory Tag -->

      </div>
    </header>
    <!-- END: TopBar -->
    <!-- BEGIN: GlassLoginForm -->
    <main class="relative z-10 my-auto py-2">
      <div class="glass-card-main rounded-[32px] p-6 sm:p-7 relative overflow-hidden">
        <div class="specular-highlight"></div>
        <!-- BEGIN: AppBranding -->
        <div class="text-center pt-2 pb-5" data-purpose="brand-header">
          <!-- Logo with glowing cyber brain inside 'O' -->
          <div class="inline-flex items-center justify-center space-x-1.5 mb-1.5">
            <span
              class="text-3xl font-black tracking-tight text-white drop-shadow-[0_2px_10px_rgba(255,255,255,0.4)]">S</span>
            <!-- Brain Digital Icon for 'O' -->
            <div
              class="relative flex items-center justify-center w-8 h-8 rounded-full shadow-[0_0_15px_rgba(217,70,239,0.7)] shrink-0 overflow-hidden">
              <img
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGOCZTICSPS2IqZ6OnP1mSw6dUBfVRdoDjJ51yU42azclcPDwbwpO1NVeUjD-SHUhARt2JPVzJbtHLSna3T2sD937ZhrOJL4U5_s1nLZZnDCMgmN2pmlTJDt_hZqkmDL5f_2khcyrmYNg_WVVmijbDGF59tgoPQ597A4ZqkzTIyk6VH4FhhsMAHo5X1GPqKRbHcoekHpJ4dD-bnvPEW903NCIa-daAF0m41qAN7qZYFM426RT9Nf1hGQ"
                alt="SOFIA Icon" class="w-full h-full object-cover rounded-full"></div>
            <span
              class="text-3xl font-black tracking-tight text-white drop-shadow-[0_2px_10px_rgba(255,255,255,0.4)]">FIA</span>
          </div>
          <!-- Subtitle -->
          <p class="text-[12px] leading-snug text-purple-200/80 font-normal px-2 max-w-[260px] mx-auto">
            Boas-vindas à comunidade</p>
        </div>
        <!-- END: AppBranding -->
        <!-- BEGIN: InputFields -->
        <form class="space-y-3.5" data-purpose="login-form" id="sofia-login-form" onsubmit="event.preventDefault();">
          <!-- Field: Usuário ou E-mail -->
          <div>
            <div class="glass-input-box rounded-2xl flex items-center px-4 py-3 text-sm">
              <i class="fa-regular fa-user text-purple-300/60 mr-3 text-sm"></i>
              <input autocomplete="username"
                class="w-full bg-transparent border-0 p-0 text-sm text-white placeholder:text-purple-300/40 focus:ring-0 focus:outline-none"
                id="login-username" placeholder="Usuário ou E-mail" required="" type="text">
            </div>
          </div>
          <!-- Field: Senha -->
          <div>
            <div class="glass-input-box rounded-2xl flex items-center px-4 py-3 text-sm">
              <i class="fa-solid fa-lock text-purple-300/60 mr-3 text-sm"></i>
              <input autocomplete="current-password"
                class="w-full bg-transparent border-0 p-0 text-sm text-white placeholder:text-purple-300/40 focus:ring-0 focus:outline-none"
                id="login-password" placeholder="Senha" required="" type="password">
              <button class="text-purple-300/50 hover:text-purple-200 focus:outline-none ml-2"
                data-purpose="toggle-password-visibility" type="button">
                <i class="fa-regular fa-eye-slash text-xs"></i>

            </div>
          </div>
          <!-- Primary CTA Button: ENTRAR -->
          <div class="pt-1.5">
            <button

              data-purpose="submit-login" type="submit">
              <span class="">Entrar</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </div>
        </form>
        <!-- END: InputFields -->
        <!-- BEGIN: SocialLogins -->
        <div class="mt-4 pt-3 border-t border-purple-500/15" data-purpose="social-login-section">
          <p class="text-center text-[10px] uppercase font-semibold text-purple-300/50 mb-3 tracking-widest">Ou acesse
            com</p>
          <div class="grid grid-cols-2 gap-3">
            <!-- Apple Sign-in Button -->
            <button
              class="glass-pill rounded-xl py-2.5 px-3 flex items-center justify-center gap-2 hover:bg-white/10 active:scale-95 transition text-white"

            <!-- Google Sign-in Button -->

              <span class="text-xs font-medium">Google</span>

        <!-- END: SocialLogins -->
        <!-- BEGIN: FooterLinks -->
        <div class="mt-4 flex items-center justify-between text-xs px-1 font-medium">
          <a class="text-purple-300/90 hover:text-white transition" href="#cadastro">Criar conta</a>
          <a class="text-fuchsia-400 hover:text-fuchsia-300 transition" href="#recuperar">Esqueci minha senha</a>
        </div>
        <!-- END: FooterLinks -->
      </div>
    </main>
    <!-- END: GlassLoginForm -->
    <!-- BEGIN: LiveCommunityWidgetsPreview -->
    <!-- Ambient peeking elements at bottom of screen representing interactive social features -->
    <section aria-label="Comunidades e Enquetes em Destaque" class="relative z-10 pt-1 pb-2 space-y-2.5">
      <!-- Mini Floating Pill Tags Row -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[11px]">
        <div class="glass-pill-active rounded-full px-3 py-1 flex items-center gap-1.5 text-purple-200 shrink-0">
          <i class="fa-solid fa-users text-[10px] text-fuchsia-400"></i>
          <span class="font-semibold">Comunidades</span>
        </div>
        <div class="glass-pill rounded-full px-2.5 py-1 flex items-center gap-1 text-purple-200/80 shrink-0">
          <span class="text-pink-400 font-bold">#</span>
          <span class="">Tecnologia</span>
        </div>
        <div class="glass-pill rounded-full px-2.5 py-1 flex items-center gap-1 text-purple-200/80 shrink-0">
          <span class="text-purple-400 font-bold">#</span>
          <span class="">Tópicos</span>
        </div>
        <div class="glass-pill rounded-full px-2.5 py-1 flex items-center gap-1 text-purple-200/80 shrink-0">
          <i class="fa-solid fa-crown text-[9px] text-amber-400"></i>
          <span class="">Cargos &amp; Tiers</span>
        </div>
      </div>
      <!-- Quick Enquetes (Polls) Interactive Micro-card Preview -->
      <div class="glass-card-main rounded-2xl p-3 text-xs backdrop-blur-md bg-purple-950/20 border-purple-400/15">
        <div class="flex items-center justify-between mb-2">

            <span class="">Enquete da Comunidade</span>
          </div>
          <span class="text-[10px] text-purple-300/60 font-mono">1.4k votos</span>
        </div>
        <!-- Poll option 1 -->
        <div class="space-y-1 mb-2">
          <div class="flex justify-between text-[11px] font-medium text-purple-100">
            <span class="">Inteligência Artificial &amp; Devs</span>
            <span class="text-fuchsia-300 font-semibold">50%</span>
          </div>
          <div class="w-full bg-purple-950/60 rounded-full h-1.5 overflow-hidden">

          </div>
          <div class="w-full bg-purple-950/60 rounded-full h-1.5 overflow-hidden">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-500 h-1.5 rounded-full w-[20%]"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- END: LiveCommunityWidgetsPreview -->
    <!-- Home Indicator Bar for iOS -->
    <div class="w-32 h-1 bg-white/20 rounded-full mx-auto my-1 pointer-events-none"></div>
  </div>
  <!-- END: MobileDeviceContainer -->
  <!-- BEGIN: Scripts for Micro-Interactions -->
  <script data-purpose="toggle-password">
    // Password visibility toggle interaction
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.querySelector('[data-purpose="toggle-password-visibility"]');
      const passwordInput = document.getElementById('login-password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

          const icon = toggleBtn.querySelector('i');
          if (icon) {
            icon.classList.toggle('fa-eye-slash');
            icon.classList.toggle('fa-eye');
          }
        });
      }
    });
  </script>
  <!-- END: Scripts for Micro-Interactions -->




</body>

</html>
