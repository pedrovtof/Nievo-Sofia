name: Gemini PR Review
on: [pull_request]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Code Review com Gemini
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-2.5-flash"
          prompt: |
            Você é um engenheiro de software sênior. Revise este PR com foco em:
            - Aplicação de princípios SOLID, ciclo de vida e injeção de dependência.
            - Tratamento de exceções e otimização de consultas (com atenção a ambientes C#, .NET, Python, Node.js e GO).
            - Forneça trechos de código com a correção quando necessário.
            - Responda sempre em português do Brasil.