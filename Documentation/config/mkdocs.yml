site_name: Sofia Docs
site_url: https://sofia.app.docs.com/docs
nav:
  - Home: index.md
  - Business Rules:
      - Overview: business-rules/index.md
      - Exception Handling: business-rules/exception-handling-decision-flow.md
  - Backend:
      - Auth Domain & Contracts: backend/domain/auth.md
  - API:
      - Health & Diagnostics: api/endpoints/health.md

theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.ico
  palette:
    - scheme: slate # Midnight Nebula is strictly dark-mode-first
      primary: custom
      accent: custom
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - search.suggest
    - content.code.copy
extra_css:
  - styles/custom.css
